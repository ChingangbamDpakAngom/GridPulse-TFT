[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpulse-tft"
version = "0.1.0"
description = "UK Smart Grid Carbon Intensity Forecaster with TFT-lite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "torch>=2.3",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "onnxruntime>=1.18",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "wandb>=0.17",
    "python-dotenv>=1.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "tenacity>=8.4",
    "orjson>=3.10",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
dashboard = [
    "streamlit>=1.37",
    "altair>=5.3",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "requests>=2.31",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocs-glightbox>=0.1",
    "mkdocs-mermaid2-plugin>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "data", "models", "logs", "*.onnx", "*.pth", "*.parquet"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "C90", "B", "C4", "DTZ", "ERA", "EXE", "FA", "ICN", "ISC", "PIE", "PT", "Q", "RSE", "RET", "SIM", "TID", "TRY", "TCH", "YTT"]
ignore = ["TRY003", "TRY300", "TRY301"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["src"]