site_name: GridPulse-TFT
site_description: UK Smart Grid Carbon Intensity Forecaster with TFT-lite
site_url: https://github.com/yourorg/gridpulse-tft
repo_url: https://github.com/yourorg/gridpulse-tft
repo_name: GridPulse-TFT
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
  - glightbox
  - mermaid2

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Architecture: ARCHITECTURE.md
  - API Reference: api.md
  - Dashboard: dashboard.md
  - Components:
      - Ingestion: components/ingestion.md
      - Processing: components/processing.md
      - Model: components/model.md
      - Serving: components/serving.md
      - Dashboard: components/dashboard.md
  - Operations:
      - Commands: operations/commands.md
      - Configuration: operations/config.md
      - Monitoring: operations/monitoring.md
      - Troubleshooting: operations/troubleshooting.md
  - Development:
      - Contributing: development/contributing.md
      - Testing: development/testing.md
      - Extending: development/extending.md
  - Concepts:
      - Quantile Forecasting: concepts/quantiles.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourorg/gridpulse-tft
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/gridpulse-tft/

copyright: © 2026 GridPulse-TFT Contributors